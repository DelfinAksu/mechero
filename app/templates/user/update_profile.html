
{% extends 'layout/base_user.html' %}

{% block content %}
<div class="profile-wrapper">
  <div class="profile-left">
    <img src="{{ url_for('static', filename='images/features.jpg') }}" alt="Profile Image">
  </div>

  <div class="profile-right">
    <h2 class="profile-title">Update Your Profile</h2>
    <form method="POST">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Name:</label>
        <input type="text" name="fname" value="{{ user.u_fname }}" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-user-tag"></i> Surname:</label>
        <input type="text" name="lname" value="{{ user.u_lname }}" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-phone"></i> Phone:</label>
        <input type="text" name="phone" value="{{ user.u_phone }}" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> E-mail:</label>
        <input type="email" name="email" value="{{ user.u_mail }}" required>
      </div>

      <hr>

      <h3 class="password-title">Update Password</h3>
      <div class="form-group">
        <label>Current Password:</label>
        <input type="password" name="old_password">
      </div>
      <div class="form-group">
        <label>New Password:</label>
        <input type="password" name="new_password">
      </div>
      <div class="form-group">
        <label>Confirm New Password:</label>
        <input type="password" name="confirm_password">
      </div>

      <button type="submit" class="update-button">Save</button>
    </form>
  </div>
</div>
{% endblock %}
