<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login-layout">
    <div class="login-left">
      <img src="{{ url_for('static', filename='images/login-side.jpg') }}" alt="Login Visual">
      <div class="login-left-text">
        <h2>Welcome back!</h2>
        <p>Let’s get your car the care it deserves.</p>
      </div>
    </div>

    <div class="login-right">
      <form method="POST" class="modern-login-form">
        {{ form.hidden_tag() }}
        <h2>Login</h2>
        <div class="form-group">
            <label for="email">Email</label>
            {{ form.email(class="form-input") }}
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            {{ form.password(class="form-input") }}
        </div>

        <div>
          {{ form.submit(class="login-button") }}
        </div>
      
      </form>
    </div>
  </div>
</body>
</html>
