<!DOCTYPE html> 
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="dashboard-header">
        <img src="{{ url_for('static', filename='images/Dashboard.jpg') }}" alt="Dashboard Banner" class="dashboard-image">
        <h2 class="dashboard-message">Welcome</h2>
    </div>

    <div class="dashboard-nav">
        <a href="{{ url_for('employee.appointments') }}">Appointments</a>
        <form action="{{ url_for('guest.logout_page') }}" method="POST" style="display:inline;">
            <button type="submit" class="dashboard-logout-button">Log Out</button>
        </form>
    </div>

    <script>
        window.addEventListener("load", function () {
            document.body.classList.add("loaded");
        });    
    </script>

</body>
</html>
